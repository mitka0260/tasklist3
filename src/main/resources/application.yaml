spring:

  application:
    name: tasklist3

  config:
    import: optional:file:.env[.properties]

  cache:
    type: redis
    cache-names: redis-cache

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}?currentSchema=${POSTGRES_SCHEMA}
#    url: jdbc:postgresql://localhost:5433/tasklist3?currentSchema=tasklist3
#    url: jdbc:postgresql://db:5432/tasklist3?currentSchema=tasklist3
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

#  sql:
#    init:
#      mode: always
#      mode: never
#      continue-on-error: false
#      надо запустить только один раз - данные не будут вставляться дважды (либо на 2 строки выше поставить mode: never)
#      data-locations: classpath:demo_data.sql

  liquibase:
    change-log: classpath:liquibase/db.changelog.yaml
    enabled: true
    default-schema: tasklist3

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml

# https://www.base64encode.net/ -> someLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongStringsomeLongString
# some string for my secret for spring security and Jwt authorization. This string must be enough long to protect my application from fucking hackers.
security:
  jwt:
    secret: ${JWT_SECRET}
    access: 1
    refresh: 30

springdoc:
  override-with-generic-response: false
